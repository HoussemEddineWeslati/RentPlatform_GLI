name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests and type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  client:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/client/package-lock.json
      - run: npm ci
      - run: npm run build
